name: Deploy to GCP Server

on:
  push:
    branches:
      - version-16

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: frappe
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            export PATH=$PATH:/home/frappe/.local/bin:/usr/local/bin
            
            # Navigate to the app directory using the frappe user's home path
            cd /home/frappe/frappe-bench/apps/marvin
            
            # Sync files with GitHub
            git fetch origin version-16
            git reset --hard origin/version-16
            
            # Rebuild assets from the bench root
            cd /home/frappe/frappe-bench
            bench clear-cache
            bench build --app marvin