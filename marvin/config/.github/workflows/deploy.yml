name: Deploy to GCP Server

on:
  push:
    branches:
      - version-16

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: frappe
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # Set the path variable for the frappe user
            export PATH=$PATH:/home/frappe/.local/bin:/usr/local/bin
            
            # Go to the app directory inside marvindizor08's home folder
            cd /home/marvindizor08/frappe-bench/apps/marvin
            
            # Force pull the files from GitHub
            git fetch origin version-16
            git reset --hard origin/version-16
            
            # Navigate to the bench to clear cache and build assets
            cd /home/marvindizor08/frappe-bench
            bench clear-cache
            bench build --app marvin