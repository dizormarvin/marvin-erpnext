name: Deploy to GCP Server

on:
  push:
    branches:
      - version-16

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: frappe
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # Load environment variables for your user profile
            export PATH=$PATH:/home/marvindizor08/.local/bin
            
            # Navigate directly to the app's git folder under your home directory
            cd /home/marvindizor08/frappe-bench/apps/marvin
            
            # Force Git to sync with GitHub exactly
            git fetch origin version-16
            git reset --hard origin/version-16
            
            # Clear cache and build the production assets
            cd /home/marvindizor08/frappe-bench
            bench clear-cache
            bench build --app marvin