name: Deploy to GCP Server

on:
  push:
    branches:
      - version-16

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: frappe
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # 1. Hardcode the path to the NVM Node v24 binary so it overrides system Node
            export PATH=/home/frappe/.nvm/versions/node/v24.18.0/bin:$PATH
            
            # Set other standard path variables for the frappe user environment
            export PATH=$PATH:/home/frappe/.local/bin:/usr/local/bin
            
            # Verify the version printed in the log is 24
            node -v
            
            # 2. Navigate to the app folder to sync the code
            cd /home/frappe/frappe-bench/apps/marvin
            
            # Force overwrite local files with your GitHub code
            git fetch origin version-16
            git reset --hard origin/version-16
            
            # 3. Go to the bench root to clear cache and compile assets
            cd /home/frappe/frappe-bench
            bench clear-cache
            bench build --app marvin