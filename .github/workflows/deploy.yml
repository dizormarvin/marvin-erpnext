name: Deploy to GCP Server

on:
  push:
    branches:
      - version-16

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: frappe
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            export PATH=$PATH:/home/frappe/.local/bin:/usr/local/bin
            
            # 1. Pull the latest code changes
            cd /home/frappe/frappe-bench/apps/marvin
            git fetch origin version-16
            git reset --hard origin/version-16
            
            # 2. Clear application cache and rebuild frontend assets
            cd /home/frappe/frappe-bench
            bench clear-cache
            bench build --app marvin
            
            # 3. Restart bench processes to apply backend updates instantly
            bench restart